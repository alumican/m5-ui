; On-device tests (Unity). Connect a CoreS3, then: pio test
; Build only: pio test --without-uploading --without-testing
[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
test_framework = unity
test_speed = 115200
lib_deps =
  m5stack/M5Unified@0.2.29
  m5stack/M5GFX@0.2.36
  symlink://..
